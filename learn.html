<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易道认知工坊 · 现代沉浸式自修课堂</title>
  <!-- 引入课程全息数据库（添加版本号防止本地开发环境浏览器静态文件强缓存） -->
  <script src="course_data.js?v=20261026_1648"></script>
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span>☯️ 易道认知工坊</span>
      <span class="brand-badge">自修精进版</span>
    </div>
    <div class="top-actions">
      <select id="routeFilter" class="route-selector" onchange="filterRoute(this.value)">
        <option value="all">🗺️ 完整全修路线 (68节)</option>
        <option value="growth">🚀 个人成长与晋升</option>
        <option value="crisis">🛡️ 逆境生存与破局</option>
        <option value="leadership">👑 领导力与组织博弈</option>
        <option value="wisdom">🧘 易理哲学与心智修炼</option>
      </select>
      <button class="btn-action" onclick="toggleTheme()" id="themeBtn" title="切换暗黑/宣纸浅色">🌓 主题</button>
      <button class="btn-action" onclick="toggleSidebar()" id="toggleSidebarBtn">☰ 目录</button>
    </div>
  </header>

  <!-- 工作区 -->
  <div class="main-wrapper">
    <!-- 左侧课程大纲栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchInput" placeholder="🔍 搜索卦名、爻象、关键词..." oninput="handleSearch(this.value)">
      </div>
      <div class="progress-box">
        <span>研习进度: <b id="progressPercent">0%</b></span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
      <div class="course-tree" id="courseTree">
        <!-- 动态生成目录 -->
      </div>
    </aside>

    <!-- 右侧沉浸式研习器 -->
    <main class="reader-container">
      <div class="reader-content" id="readerContent">
        <!-- 动态渲染当前课时 -->
      </div>
      
      <!-- 底部翻页控制器 -->
      <footer class="footbar">
        <button class="foot-btn" onclick="prevLesson()" id="btnPrev">◀ 上一课 (←)</button>
        <button class="foot-btn primary" onclick="toggleCurrentDone()" id="btnDone">✓ 标记已掌握 (空格)</button>
        <button class="foot-btn" onclick="nextLesson()" id="btnNext">下一课 (→) ▶</button>
      </footer>
    </main>
  </div>

  <script>
    let currentLessonIndex = 0;
    let flatLessons = [];
    let completedLessons = new Set();

    function init() {
      try {
        const saved = localStorage.getItem('yijing_completed');
        if (saved) completedLessons = new Set(JSON.parse(saved));
        const theme = localStorage.getItem('yijing_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}

      flatLessons = [];
      if (window.COURSE && window.COURSE.parts) {
        window.COURSE.parts.forEach(part => {
          part.topics.forEach(topic => {
            topic.lessons.forEach(lesson => {
              flatLessons.push({
                ...lesson,
                partTitle: part.title,
                topicTitle: topic.title
              });
            });
          });
        });
      }

      renderSidebar();
      // 默认如果上次记录是0，而且乾卦在第3课或第几课，找到乾卦的位置
      let defaultIdx = flatLessons.findIndex(l => l.id === "lesson-01_乾为天");
      if (defaultIdx < 0) defaultIdx = 0;
      
      const lastIdxStr = localStorage.getItem('yijing_last_idx');
      const lastIndex = lastIdxStr !== null ? parseInt(lastIdxStr, 10) : defaultIdx;
      loadLesson(lastIndex >= 0 && lastIndex < flatLessons.length ? lastIndex : defaultIdx);
      updateProgress();

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevLesson();
        if (e.key === 'ArrowRight') nextLesson();
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          toggleCurrentDone();
        }
      });
    }

    function renderSidebar(filterText = '') {
      const container = document.getElementById('courseTree');
      container.innerHTML = '';

      window.COURSE.parts.forEach(part => {
        const partDiv = document.createElement('div');
        partDiv.className = 'part-group';
        partDiv.innerHTML = `<div class="part-title"><span>${part.num} · ${part.title}</span></div>`;

        part.topics.forEach(topic => {
          const topicDiv = document.createElement('div');
          topicDiv.className = 'topic-group';

          topic.lessons.forEach(lesson => {
            const idx = flatLessons.findIndex(l => l.id === lesson.id);
            if (filterText) {
              const str = (lesson.title + lesson.navTitle + (lesson.motto || '') + (lesson.symbol || '')).toLowerCase();
              if (!str.includes(filterText.toLowerCase())) return;
            }

            const isDone = completedLessons.has(lesson.id);
            const isActive = idx === currentLessonIndex;
            const item = document.createElement('div');
            item.className = `lesson-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`;
            item.onclick = () => loadLesson(idx);
            item.innerHTML = `
              <span class="status-icon">${isDone ? '✓' : '○'}</span>
              <span style="font-size:14px; color:var(--gold);">${lesson.symbol || '·'}</span>
              <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lesson.navTitle || lesson.title}</span>
              ${lesson.tag ? `<span class="lesson-tag">${lesson.tag}</span>` : ''}
            `;
            topicDiv.appendChild(item);
          });

          if (topicDiv.children.length > 0) {
            partDiv.appendChild(topicDiv);
          }
        });

        if (partDiv.children.length > 1) {
          container.appendChild(partDiv);
        }
      });
    }

    function loadLesson(idx) {
      if (idx < 0 || idx >= flatLessons.length) return;
      currentLessonIndex = idx;
      localStorage.setItem('yijing_last_idx', idx);

      const lesson = flatLessons[idx];
      const content = document.getElementById('readerContent');

      // 1. 生成竖排六爻天梯 HTML (严格自下而上，初爻在底，上爻在顶)
      let verticalLadderHtml = '';
      if (lesson.lines && lesson.lines.length === 6) {
        const rungNames = ['初爻 (萌芽)', '二爻 (破土)', '三爻 (惕励)', '四爻 (跃迁)', '五爻 (尊位)', '上爻 (极盛)'];
        let rungsHtml = '';
        // lines 索引 0 是初爻，5 是上爻。flex-direction: column-reverse 保证 index 0 排在最下面！
        lesson.lines.forEach((line, i) => {
          const isYang = (line === 1);
          const targetId = `yao-card-${i}`;
          rungsHtml += `
            <div class="yao-ladder-rung" onclick="scrollToYao('${targetId}')" title="点击定位到${rungNames[i]}">
              <span class="yao-pos-name">${rungNames[i]}</span>
              <div class="yao-graphic ${isYang ? 'yang' : 'yin'}">
                ${isYang ? '' : '<div class="yin-half"></div><div class="yin-half"></div>'}
              </div>
              <span style="font-size:11px; font-weight:700; color:${isYang ? 'var(--gold)' : 'var(--blue)'};">
                ${isYang ? '九 (刚)' : '六 (柔)'}
              </span>
            </div>
          `;
        });

        verticalLadderHtml = `
          <div class="yao-ladder-container">
            <div class="yao-ladder" title="易道自下而上时位演进天梯 (初爻在底，上爻在顶)">
              ${rungsHtml}
            </div>
            <div class="yao-ladder-intro">
              <h4>📐 竖向时位演化天梯（自下而上发展模型）</h4>
              <p>古人画卦，<b>自下而上</b>逐爻推演。初爻为发端蓄势，二爻崭露锋芒，三爻下卦之顶多艰危，四爻改革跃变，五爻中正尊位掌全盘，上爻物极必反亢龙悔。点击左侧各爻阶梯，可直接滑动穿透至该爻的实战攻防精析。</p>
            </div>
          </div>
        `;
      }

      // 2. 经传宗本与名家羽翼 HTML
      let classicsHtml = '';
      if (lesson.classics_meta) {
        const c = lesson.classics_meta;
        let wingsHtml = '';
        if (c.masters_wings && c.masters_wings.length > 0) {
          wingsHtml = '<div class="classic-wings-grid">';
          c.masters_wings.forEach(w => {
            wingsHtml += `
              <div class="wing-box">
                <div class="wing-box-title">🏛️ ${w.school}</div>
                <div style="color:var(--text-m); font-size:13px;">${w.core}</div>
              </div>
            `;
          });
          wingsHtml += '</div>';
        }

        classicsHtml = `
          <section class="step-section" style="border-left:4px solid var(--gold);">
            <div class="step-header">
              <span class="step-badge" style="background:var(--gold-light); color:var(--gold);">壹 · 经传宗本与名家羽翼</span>
              <h3 class="step-title">原典宗本与哲学名理</h3>
            </div>
            <div class="step-body">
              <div style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:14px;">
                <div style="font-size:18px; font-weight:800; color:var(--text-m); margin-bottom:6px;">【卦辞】：${c.guaci}</div>
                <div style="color:var(--text-sub); font-size:14px;"><b>正解经义：</b>${c.guaci_desc}</div>
              </div>
              <div style="background:var(--border-light); border-left:3px solid var(--gold); padding:10px 14px; margin-bottom:10px; font-size:13.5px;">
                <b>《彖传》大义：</b>${c.tuan}
              </div>
              <div style="background:var(--border-light); border-left:3px solid var(--accent); padding:10px 14px; margin-bottom:16px; font-size:13.5px;">
                <b>《大象传》道法：</b>${c.daxiang}
              </div>
              <h4 style="font-size:14.5px; font-weight:700; color:var(--text-m); margin-bottom:10px;">📚 知识库四大宗师羽翼阐微：</h4>
              ${wingsHtml}
            </div>
          </section>
        `;
      }

      // 3. 逐爻深度解构卡片集 HTML
      let yaosDeepHtml = '';
      if (lesson.yaos_deep && lesson.yaos_deep.length > 0) {
        yaosDeepHtml = `
          <section class="step-section" style="border-left:4px solid var(--accent); background:transparent; border:none; padding:0; box-shadow:none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
              <span class="step-badge" style="background:var(--accent-light); color:var(--accent);">贰 · 六爻全息时位精研</span>
              <h3 class="step-title" style="font-size:20px; font-weight:800;">逐爻原典档案、宋儒象占与现代实战攻防</h3>
            </div>
        `;

        lesson.yaos_deep.forEach((y, i) => {
          yaosDeepHtml += `
            <div class="yao-deep-card" id="yao-card-${i}">
              <div class="yao-deep-header">
                <div class="yao-deep-title">
                  <span class="yao-pos-badge">${y.pos}</span>
                  <span>${y.text}</span>
                </div>
                <span class="yao-stage-tag">${y.pos_name}</span>
              </div>
              <div class="yao-deep-body">
                <div style="font-size:13.5px; color:var(--text-sub); margin-bottom:12px; font-style:italic;">
                  ${y.xiang}
                </div>

                <!-- 经典四维羽翼 -->
                <div class="classic-wings-grid">
                  <div class="wing-box">
                    <div class="wing-box-title zhuxi">📖 朱熹《周易本义》象占</div>
                    <div>${y.zhuxi}</div>
                  </div>
                  <div class="wing-box">
                    <div class="wing-box-title shaoyong">🔮 邵雍《河洛理数》先贤断语</div>
                    <div>${y.shaoyong}</div>
                  </div>
                </div>

                <!-- 现代心智解码 -->
                <div class="modern-decode-box">
                  <b>💡 现代心智底层解码：</b>${y.decode}
                </div>

                <!-- 攻防场景 -->
                <div style="margin-top:12px; background:var(--bg); border:1px solid var(--border-light); border-radius:6px; padding:12px 14px; font-size:13.5px; line-height:1.7;">
                  <b style="color:var(--gold);">🎯 现实场景攻防：</b>${y.scene}
                </div>

                <!-- 红线禁忌 -->
                <div class="redline-warning">
                  <span>⚠️</span>
                  <span><b>致命红线与禁忌：</b>${y.redline}</span>
                </div>
              </div>
            </div>
          `;
        });

        yaosDeepHtml += `</section>`;
      }

      // 优先渲染全息大课版本
      if (lesson.full_rich_html) {
        content.innerHTML = `
          <div class="lesson-header">
            <div class="header-top">
              <div class="gua-symbol-badge">${lesson.symbol || '☯️'}</div>
              <div class="header-meta">
                <h1>${lesson.title}</h1>
                <div class="motto">${lesson.motto || ''} · 所属篇章：${lesson.partTitle}</div>
              </div>
            </div>
            <div class="header-tags">
              <span class="pill-tag">⏱️ 建议研读 25 分钟</span>
              ${lesson.upper ? `<span class="pill-tag" style="background:var(--gold-light); color:var(--gold);">上卦：${lesson.upper}</span>` : ''}
              ${lesson.lower ? `<span class="pill-tag" style="background:var(--purple-light); color:var(--purple);">下卦：${lesson.lower}</span>` : ''}
              <span class="pill-tag" style="background:var(--accent-light); color:var(--accent);">阶梯主题：${lesson.topicTitle}</span>
            </div>
            ${verticalLadderHtml}
          </div>
          ${lesson.full_rich_html}
        `;
        content.scrollTop = 0;
        document.getElementById('btnPrev').disabled = (idx === 0);
        document.getElementById('btnNext').disabled = (idx === flatLessons.length - 1);
        const isDone = completedLessons.has(lesson.id);
        const btnDone = document.getElementById('btnDone');
        btnDone.innerHTML = isDone ? '✓ 已掌握 (点击取消)' : '○ 标记已掌握 (空格)';
        btnDone.style.background = isDone ? 'var(--gold)' : 'var(--accent)';
        renderSidebar(document.getElementById('searchInput').value);
        return;
      }

      // 组合常规页面
      content.innerHTML = `
        <div class="lesson-header">
          <div class="header-top">
            <div class="gua-symbol-badge">${lesson.symbol || '☯️'}</div>
            <div class="header-meta">
              <h1>${lesson.title}</h1>
              <div class="motto">${lesson.motto || ''} · 所属篇章：${lesson.partTitle}</div>
            </div>
          </div>
          <div class="header-tags">
            <span class="pill-tag">⏱️ 建议研读 15 分钟</span>
            ${lesson.upper ? `<span class="pill-tag" style="background:var(--gold-light); color:var(--gold);">上卦：${lesson.upper}</span>` : ''}
            ${lesson.lower ? `<span class="pill-tag" style="background:var(--purple-light); color:var(--purple);">下卦：${lesson.lower}</span>` : ''}
            <span class="pill-tag" style="background:var(--accent-light); color:var(--accent);">阶梯主题：${lesson.topicTitle}</span>
          </div>
          ${verticalLadderHtml}
        </div>

        <!-- 壹· 经传宗本 -->
        ${classicsHtml}

        <!-- 贰· 六爻逐爻全息精研 -->
        ${yaosDeepHtml}

        <!-- 叁· 引导反思 -->
        <section class="step-section step-think">
          <div class="step-header">
            <span class="step-badge">叁 · 引导反思 · 本质解码</span>
            <h3 class="step-title">${lesson.step2_think.question}</h3>
          </div>
          <div class="step-body">
            ${lesson.step2_think.core}
          </div>
        </section>

        <!-- 肆· 场景迁移 -->
        <section class="step-section step-scene">
          <div class="step-header">
            <span class="step-badge">肆 · 场景迁移 · 真实推演</span>
            <h3 class="step-title">从古文典籍到现代实战维度的全景映射</h3>
          </div>
          <div class="step-body">
            <div class="scene-cards" style="grid-template-columns:1fr; gap:16px;">
              <div class="scene-card">
                <h4>💼 职场与合伙人演进路线</h4>
                <p>${lesson.step3_scene.workplace}</p>
              </div>
              <div class="scene-card">
                <h4>🎯 商业与项目生命周期模型</h4>
                <p>${lesson.step3_scene.business}</p>
              </div>
            </div>
            <p style="margin-top:14px; font-size:13px; color:var(--text-faint); border-left:3px solid var(--gold); padding-left:10px;">
              <b>典籍羽翼提炼：</b> ${lesson.step3_scene.classic_note}
            </p>
          </div>
        </section>

        <!-- 伍· 费曼输出 -->
        <section class="step-section step-teach">
          <div class="step-header">
            <span class="step-badge">伍 · 费曼输出 · 教给别人</span>
            <h3 class="step-title">能用自己的话说出来，才是真正掌握</h3>
          </div>
          <div class="step-body">
            <div class="feynman-box">
              <h4>🎯 一句话心法公式</h4>
              <div class="feynman-formula">“${lesson.step4_teach.formula}”</div>
              <p><b>【模拟实战挑战】：</b>${lesson.step4_teach.challenge}</p>
              <button class="feynman-expand-btn" onclick="toggleFeynmanAnswer(this)">展开参考讲解要点</button>
              <div class="feynman-answer" style="display:none; margin-top:12px; padding:12px; background:var(--card); border-radius:6px; font-size:13.5px; line-height:1.7; color:var(--text-m);">
                <b>讲解要点剖析：</b><br>${lesson.step4_teach.answer}
              </div>
            </div>
          </div>
        </section>
      `;

      content.scrollTop = 0;

      document.getElementById('btnPrev').disabled = (idx === 0);
      document.getElementById('btnNext').disabled = (idx === flatLessons.length - 1);
      
      const isDone = completedLessons.has(lesson.id);
      const btnDone = document.getElementById('btnDone');
      btnDone.innerHTML = isDone ? '✓ 已掌握 (点击取消)' : '○ 标记已掌握 (空格)';
      btnDone.style.background = isDone ? 'var(--gold)' : 'var(--accent)';

      renderSidebar(document.getElementById('searchInput').value);
    }

    function scrollToYao(cardId) {
      const posMap = {'yao-card-0': 'yao-card-初九', 'yao-card-1': 'yao-card-九二', 'yao-card-2': 'yao-card-九三', 'yao-card-3': 'yao-card-九四', 'yao-card-4': 'yao-card-九五', 'yao-card-5': 'yao-card-上九'};
      const el = document.getElementById(cardId) || document.getElementById(posMap[cardId]);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.borderColor = 'var(--accent)';
        setTimeout(() => {
          el.style.borderColor = '';
        }, 1500);
      }
    }

    function toggleFeynmanAnswer(btn) {
      const target = btn.nextElementSibling;
      if (target.style.display === 'none') {
        target.style.display = 'block';
        btn.innerText = '收起讲解要点';
      } else {
        target.style.display = 'none';
        btn.innerText = '展开参考讲解要点';
      }
    }

    function prevLesson() {
      if (currentLessonIndex > 0) loadLesson(currentLessonIndex - 1);
    }

    function nextLesson() {
      if (currentLessonIndex < flatLessons.length - 1) loadLesson(currentLessonIndex + 1);
    }

    function toggleCurrentDone() {
      const lesson = flatLessons[currentLessonIndex];
      if (!lesson) return;
      if (completedLessons.has(lesson.id)) {
        completedLessons.delete(lesson.id);
      } else {
        completedLessons.add(lesson.id);
      }
      localStorage.setItem('yijing_completed', JSON.stringify(Array.from(completedLessons)));
      updateProgress();
      loadLesson(currentLessonIndex);
    }

    function updateProgress() {
      const total = flatLessons.length;
      const count = completedLessons.size;
      const percent = total > 0 ? Math.round((count / total) * 100) : 0;
      document.getElementById('progressPercent').innerText = `${count}/${total} (${percent}%)`;
      document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function handleSearch(val) {
      renderSidebar(val);
    }

    function filterRoute(route) {
      if (route === 'all') {
        renderSidebar();
        return;
      }
      const container = document.getElementById('courseTree');
      const items = container.querySelectorAll('.lesson-item');
      items.forEach(it => {
        it.style.display = 'flex';
      });
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('yijing_theme', next);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    window.onload = init;
  </script>
</body>
</html>
